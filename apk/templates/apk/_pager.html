{% load ui_i18n %}
{% if page.paginator.num_pages > 1 %}
  <nav class="pager" aria-label="{% t 'Sahifalar' %}">
    {% if page.has_previous %}
      <a class="btn btn--sm" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page.previous_page_number }}">&larr; {% t "Oldingi" %}</a>
    {% endif %}
    <span>{{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
      <a class="btn btn--sm" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page.next_page_number }}">{% t "Keyingi" %} &rarr;</a>
    {% endif %}
  </nav>
{% endif %}
